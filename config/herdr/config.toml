onboarding = false

[keys]
prefix = "ctrl+t"

[ui]
agent_panel_sort = "priority"

status_indicators = "symbols"
[ui.sidebar.agents]
rows = [
  ["state_icon", "workspace", "tab"],
  [{ token = "agent", dim = false }],
]

[ui.toast]
delivery = "off"

[experimental]
pane_history = true

[ui.sound]
enabled = false

[[keys.command]]
key = "prefix+shift+o"
type = "plugin_action"
command = "kenchan.handoff.open"
description = "handoff: これから何やる？"
