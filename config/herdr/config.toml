onboarding = false

[keys]
prefix = "ctrl+t"

[ui]
agent_panel_sort = "priority"

[ui.sidebar.agents]
rows = [
  ["state_icon", "workspace", "tab"],
  [{ token = "agent", dim = false }],
]

[ui.toast]
delivery = "off"

[experimental]
pane_history = true

[[keys.command]]
key = "prefix+t"
type = "shell"
command = '"$HERDR_BIN_PATH" plugin pane open --plugin kenchan.ghq-open-agent --entrypoint picker'
description = "ghq repository picker"
