# OS 別に配置するファイル（auto_env で mise.toml に重ねて読まれる）。
# Linux 環境は WSL しかないので linux = WSL とみなしている。
# 素の Linux を使うようになったら MISE_ENV=wsl などで分ける
[dotfiles]
"~/.config/git/config.os" = "os/wsl/config/git/config.os"
"~/.config/fish/conf.d/os.fish" = "os/wsl/config/fish/conf.d/os.fish"
"~/.claude/skills/wsl2-clipboard" = { source = "os/wsl/claude/skills/wsl2-clipboard", mode = "symlink-each" }
